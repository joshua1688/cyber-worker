[project]
name = "cyber-worker"
version = "0.1.0"
description = "Send another version of yourself to work in the digital world."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10 ; sys_platform == 'win32'",
    "pydantic>=2.6",
    "pynput>=1.8",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
cyber-worker = "cyber_worker.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyber_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
