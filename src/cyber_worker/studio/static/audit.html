<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>审计 · 赛博打工人</title>
  <script>
    // 首帧前确定主题（默认深色），避免闪一下
    try {
      const p = localStorage.getItem("cw.theme") || "dark";
      const dark = p === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : p !== "light";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 role=%22img%22 aria-label=%22cyber-worker%22%3E%3Ctext x=%2250%22 y=%2254%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-size=%2286%22 font-family=%22'Segoe UI Emoji'%2C'Apple Color Emoji'%2C'Noto Color Emoji'%2Csans-serif%22%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/apps" aria-label="赛博打工人 Studio"><span class="logo-mark" aria-hidden="true">🤖</span><span class="wordmark">赛博打工人</span><span class="brand-tag">Studio</span></a>
    <nav class="nav">
      <a href="/apps"><i data-icon="layers"></i>应用</a>
      <a href="/audit" class="active"><i data-icon="audit"></i>审计</a>
    </nav>
    <span class="grow"></span>
    <button class="icon-btn" id="btn-settings" title="设置"><i data-icon="gear"></i></button>
    <button class="icon-btn" id="btn-tour" title="新手引导"><i data-icon="help"></i></button>
  </header>

  <main class="audit-layout">
    <section class="card">
      <div class="stats" id="report"></div>
      <div class="filters" id="filters">
        <select id="f-day" class="input" aria-label="日期"></select>
        <select id="f-flow" class="input" aria-label="流程"><option value="">全部流程</option></select>
        <div class="seg" id="f-show" role="radiogroup" aria-label="显示哪些运行">
          <button type="button" data-v="all" class="on">全部</button>
          <button type="button" data-v="pending">待审</button>
          <button type="button" data-v="bad">失败</button>
          <button type="button" data-v="fix">要修</button>
        </div>
        <span class="grow"></span>
        <span class="day-tools">
          <button class="icon-btn" id="btn-refresh" title="刷新"><i data-icon="refresh"></i></button>
          <button class="icon-btn" id="btn-clear-day" title="清空这一天（记录和截图一起删）" aria-label="清空这一天"><i data-icon="trash"></i></button>
        </span>
      </div>
      <div class="scroller" style="flex:1">
        <ol class="run-list" id="list"></ol>
        <div id="list-empty" class="empty" hidden>
          <div class="empty-ico"><i data-icon="audit" class="lg"></i></div>
          <h3>这一天还没有记录</h3>
          <p>在流程设计页空跑或执行一次，每一步的截图都会出现在这里。</p>
          <div class="actions"><a class="btn" href="/">去流程设计</a></div>
        </div>
      </div>
    </section>

    <section class="card" id="viewer"></section>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/tour.js"></script>
  <script src="/static/settings.js"></script>
  <script src="/static/audit.js"></script>
</body>
</html>
