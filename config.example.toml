[platforms]
enabled = ["wechat"]

[review]
comment_auto_send = false   # 确认和修改足够少之后再打开
post_auto_send = false

[limits]
comments_per_day = 5
posts_per_week = 2

[relations]
close_friends = []          # 优先互动
never_comment = []          # 永不评论，内容也不会被提取或发送给 LLM

[executor]
pause_on_user_input = true      # 你在用电脑时暂停
resume_after_idle_sec = 120     # 空闲多久后继续
# panic_hotkey = "ctrl+alt+cmd+." # 急停：中止当前动作并清空队列（默认 macOS ⌃⌥⌘. / Windows Ctrl+Alt+Shift+.；被占用时自动换一个）
dry_run = false                 # 空跑：完整执行但跳过最后的「发送」
# play_sounds = true            # 执行时给操作配上音效（鼠标点击声、青轴打字声、回车；目前只有 Windows）
# show_effects = true           # 执行时在屏幕上画出点击、双击、拖动、滚动、按键（只是画，点不到也截不进截图；目前只有 Windows）

[studio]                        # 下面这些在 studio 右上角 ⚙ 设置里都能改，改了会写回这里
# record_hotkey = "alt+r"       # 开始 / 停止录制的全局快捷键（在任何窗口里都能按）
# dry_run_hotkey = "alt+t"      # 空跑当前宏的全局快捷键（跳过「发送」；真正执行没有全局快捷键）
# theme = "dark"                # 外观：dark 深色 / light 浅色 / system 跟随系统
# record_delays = true          # 录制时把操作之间的间隔录成延迟行
# record_append = false         # 重新录制时接在已有步骤后面；默认替换旧步骤
# run_idle_sec = 2.0            # 在 studio 里点空跑 / 执行后，等键鼠停下几秒才开始
# pack_screenshots = true       # 导出平台包时带上录制时的窗口截图（导入的人能看到每一步在哪操作；可能含聊天内容）

[audit]
# keep_days = 30                # 审计记录和截图保留多少天，更早的在启动时自动删掉（studio ⚙ 设置里也能改）

[llm]
provider = "local"          # local / 云端厂商名；云端需要在 .env 填 API Key

[paths]
user_data = "user_data"
